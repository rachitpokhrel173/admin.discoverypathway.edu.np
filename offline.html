<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Discovery Pathway CRM</title>
    <link rel="icon" type="image/x-icon" href="./Discovery_Logo-removebg-preview.png">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            text-align: center;
            max-width: 400px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 24px;
            display: block;
            opacity: 0.6;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #fff;
        }
        p {
            font-size: 14px;
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 28px;
        }
        .tip {
            background: rgba(22,163,74,0.1);
            border: 1px solid rgba(22,163,74,0.25);
            border-radius: 10px;
            padding: 16px;
            font-size: 13px;
            color: #4ade80;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        button {
            background: #16a34a;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background .2s;
        }
        button:hover { background: #15803d; }
        .dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #ef4444;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">📡</span>
        <h1><span class="dot"></span>You're Offline</h1>
        <p>The Discovery Pathway CRM requires an internet connection to sync data with the server. Please check your connection and try again.</p>
        <div class="tip">
            <strong>💡 Tip:</strong> Your last-loaded data may still be visible — go back and browse what's already cached on this device.
        </div>
        <button onclick="window.location.reload()">Try Again</button>
    </div>
    <script>
        // Auto-reload when connection is restored
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
